# 全局 HTTP 配置：开启 gzip、设定上传大小上限、开启 server_tokens 隐藏
client_max_body_size 50m;
server_tokens off;
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/json
  application/javascript
  application/xml
  application/rss+xml
  image/svg+xml;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 全站安全响应头（防止点击劫持、MIME 嗅探、严格来源引用、CSP 基础保护）
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; script-src 'self'; base-uri 'self'; frame-ancestors 'self';" always;

  # index.html 永远不强缓存，保证新版本发布后立刻生效
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  # 构建产物静态资源（Vite 默认输出到 assets/）：30 天强缓存 + immutable，文件名带 hash 不会冲突
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # 其他常见静态资源扩展名兜底：同样 30 天强缓存
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot|otf|map)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # API 反向代理：提高 body size 限制 + 超时时间，兼容大 Excel 导入 / OCR 长任务
  location /api/ {
    client_max_body_size 50m;
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback：其他路径全部回退到 index.html，交给前端路由
  location / {
    try_files $uri $uri/ /index.html;
  }
}
